name: Deploy

# Déploie assur-manager.pro sur le VPS quand le CI passe sur main
# (ou à la main depuis l'onglet Actions).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement VPS (assur-manager.pro)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Le filtre `branches: [main]` compare seulement le NOM de la branche : une
    # pull request dont la branche s'appelle aussi « main » le passerait. On
    # n'accepte donc qu'un push sur main, dans ce dépôt-ci.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: production
    steps:
      - name: Préparer la clé SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Clé d'hôte épinglée : pas de ssh-keyscan (ses connexions pré-auth
          # déclenchent un ban fail2ban qui gèle ensuite la session de déploiement).
          # Port non standard : known_hosts exige la forme [hote]:port
          echo "[51.178.55.113]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGOZ9ULrfl/2nc8Ki3OiWWxTPlQcFoFe0UGlt6nKOLXP" > ~/.ssh/known_hosts

      # La clé est restreinte côté serveur (authorized_keys : restrict,command=)
      # à ~/deploy_horus_app.sh : git reset sur origin/main dans /opt/horus,
      # reconstruction Docker avec contrôle HTTP et retour arrière si KO.
      - name: Déployer
        run: |
          ssh -p 2222 -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            mada@51.178.55.113 'bash ~/deploy_horus_app.sh'
