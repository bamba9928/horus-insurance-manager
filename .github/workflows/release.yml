name: Release

# Crée une release GitHub à partir d'un tag `v*.*.*` en buildant les bundles
# Windows (MSI + NSIS). Le bundle Windows est la cible principale de ce projet
# (courtage d'assurance Sénégal — desktop Windows).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag de release (ex: v0.1.0)"
        required: true
        type: string

# Lecture seule par défaut ; seul le job de build reçoit contents: write pour
# publier la release.
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (MSI + NSIS)
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Force cargo à utiliser link.exe du PATH (exporté par ilammy/msvc-dev-cmd)
      # au lieu de la découverte via registre Windows, qui pointe vers un
      # BuildTools fantôme (14.44.35207) absent du runner windows-2022.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Verify link.exe is on PATH
        shell: pwsh
        run: |
          Write-Host "VCINSTALLDIR = $env:VCINSTALLDIR"
          where.exe link.exe
          where.exe cl.exe

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri et publier la release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: "Horus Assurances Manager ${{ github.event.inputs.version || github.ref_name }}"
          releaseBody: |
            Voir [`CHANGELOG.md`](./CHANGELOG.md) pour la liste détaillée des changements.

            **Installation Windows :**
            - `*_x64-setup.exe` (NSIS) — recommandé pour la plupart des utilisateurs
            - `*_x64_en-US.msi` (MSI) — pour les déploiements MSI en entreprise
          releaseDraft: true
          prerelease: false
